# A published (bench-validated) release goes to downloads.arkelectron.com as one
# file per package, rejoined from the parts GitHub's 2 GB asset limit forces, and
# becomes its product's latest/. Dispatch with a tag to publish an existing release.

name: Publish to downloads.arkelectron.com

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, e.g. pab-v3-6.2.2.6
        required: true

concurrency:
  group: downloads-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: downloads
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ARK-Electronics/downloads
          path: downloads

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-1
          mask-aws-account-id: true

      - name: Publish
        env:
          DOWNLOADS_BUCKET: ${{ vars.DOWNLOADS_BUCKET }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # pab-v3- before pab-, as in build.yml
          case "$TAG" in
            pab-v3-[0-9]*) product=pab-v3 ;;
            pab-[0-9]*) product=pab ;;
            jaj-[0-9]*) product=jaj ;;
            *) echo "::error::$TAG is not a release tag"; exit 1 ;;
          esac
          version=${TAG#"$product"-}
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ] \
            || { echo "::error::$TAG is still a draft; publish it after bench validation"; exit 1; }

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          mkdir release
          shopt -s nullglob
          for first in assets/*.part.aa; do
            name=$(basename "$first" .part.aa)
            cat assets/"$name".part.* > release/"$name".tar.gz
            rm assets/"$name".part.*
          done
          for f in assets/*.tar.gz; do mv "$f" release/; done
          rm -rf assets
          (cd release && sha256sum -- * > SHA256SUMS)

          downloads/downloads.py publish release "jetson/$product/$version"
          downloads/downloads.py promote "jetson/$product/$version" "jetson/$product/latest"
          downloads/downloads.py index
